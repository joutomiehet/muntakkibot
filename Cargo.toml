[package]
name = "mun_takki_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
teloxide = { version = "0.13", features = ["macros"] }
log = "0.4"
pretty_env_logger = "0.5"
tokio = { version =  "1.8", features = ["rt-multi-thread", "macros"] }
reqwest = "0.11"
dotenv = "0.15.0"
regex = "1.10.6"
once_cell = "1.21.3"
tempfile = "3.22.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
