[package]
name = "mun_takki_bot"
version = "0.1.0"
edition = "2024"

[dependencies]
teloxide = { version = "0.17", features = ["macros"] }
log = "0.4"
pretty_env_logger = "0.5"
tokio = { version =  "1.54", features = ["rt-multi-thread", "macros"] }
dotenv = "0.15.0"
once_cell = "1.21.4"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
